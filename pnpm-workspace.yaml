packages:
  - apps/*
  - packages/*

allowBuilds:
  "@scarf/scarf": false
  esbuild: false
  vue-demi: false
  # Wrangler necesita verificar su binario oficial para pruebas locales.
  workerd: true

# La instalación normal no puede modificar la resolución aprobada. Los cambios de
# dependencias se hacen de forma deliberada con `pnpm add`, `pnpm update` o
# `pnpm install --no-frozen-lockfile` y se revisa su diff.
frozenLockfile: true

# Retrasa una semana toda versión recién publicada, también transitiva. Si el
# registro no aporta fecha o no existe una versión madura que cumpla el rango,
# falla en vez de degradar la protección silenciosamente.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

# ADR-0167: excepción puntual de Expo 58.0.22 y sus dependencias necesarias.
# Autorizada explícitamente; retirar al cumplir siete días. Sin comodines.
minimumReleaseAgeExclude:
  - "expo-system-ui@58.0.7"
  - "@react-native/babel-preset@0.88.1"
  - "@react-native/metro-babel-transformer@0.88.1"
  - "@expo/metro-runtime@58.0.16"
