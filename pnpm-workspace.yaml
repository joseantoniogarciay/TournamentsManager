# Correcciones de seguridad de 2026-10-03 y ADR-0172 (2026-10-31).
# Los selectores exactos conservan
# cada rama compatible; xcode solo consume uuid.v4 y Scalar usa Fastify 5.
# Metro incorpora su propio lector de imágenes; Router 58 ya no usa query-string.
# Symbols conserva la escala de iconos (ADR-0167); config-plugins y splash-screen
# corrigen los generadores Android sin supresiones (ADR-0168).
# Pendientes y compatibilidad: DEPENDENCY_SECURITY_REVIEW_2026-10-31.md.
nodeLinker: isolated
storeDir: .pnpm-store
patchedDependencies:
  "@expo/config-plugins@58.0.11": patches/@expo__config-plugins@58.0.11.patch
  expo-splash-screen@58.0.12: patches/expo-splash-screen@58.0.12.patch
  expo-symbols@58.0.4: patches/expo-symbols@58.0.4.patch
