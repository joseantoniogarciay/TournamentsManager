packages:
  - apps/*
  - packages/*

allowBuilds:
  "@scarf/scarf": false
  esbuild: false
  vue-demi: false

# La instalación normal no puede modificar la resolución aprobada. Los cambios de
# dependencias se hacen de forma deliberada con `pnpm add`, `pnpm update` o
# `pnpm install --no-frozen-lockfile` y se revisa su diff.
frozenLockfile: true

# Retrasa una semana toda versión recién publicada, también transitiva. Si el
# registro no aporta fecha o no existe una versión madura que cumpla el rango,
# falla en vez de degradar la protección silenciosamente.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

# Los rangos de Expo Router admiten revisiones más nuevas que aún no han
# madurado. Se fijan a las últimas revisiones anteriores compatibles para que el
# árbol pueda respetar la política sin una exclusión por edad.
overrides:
  "@expo/log-box": 57.0.1
  "@expo/metro-runtime": 57.0.4

nodeLinker: isolated
storeDir: .pnpm-store
