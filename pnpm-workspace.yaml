packages:
  - apps/*
  - packages/*

allowBuilds:
  "@scarf/scarf": false
  esbuild: false
  vue-demi: false

# La instalación normal no puede modificar la resolución aprobada. Los cambios de
# dependencias se hacen de forma deliberada con `pnpm add`, `pnpm update` o
# `pnpm install --no-frozen-lockfile` y se revisa su diff.
frozenLockfile: true

# Retrasa una semana toda versión recién publicada, también transitiva. Si el
# registro no aporta fecha o no existe una versión madura que cumpla el rango,
# falla en vez de degradar la protección silenciosamente.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

# ADR-0138: solo una vulnerabilidad crítica aplicable permite una excepción
# exacta y documentada; la compatibilidad de Expo conserva la espera de siete días.
minimumReleaseAgeExclude: []

# Los rangos de Expo Router admiten revisiones más nuevas que aún no han
# madurado. Se fijan a las últimas revisiones anteriores compatibles para que el
# árbol pueda respetar la política sin una exclusión por edad.
overrides:
  "@expo/log-box": 57.0.4
  "@expo/metro-runtime": 57.0.16
  "@faker-js/faker@10.4.0": 10.6.0
  "@scalar/cli>@fastify/static": 10.1.2
  "@hono/node-server@2.0.1": 2.0.10
  "@xmldom/xmldom@0.8.13": 0.8.15
  "@xmldom/xmldom@0.9.10": 0.9.12
  "brace-expansion@1.1.16": 1.1.21
  "brace-expansion@5.0.8": 5.0.12
  "fast-uri@3.1.4": 3.1.8
  "fast-uri@4.1.1": 4.1.5
  "fastify@5.8.5": 5.12.5
  "hono@4.12.32": 4.13.7
  "js-yaml@4.3.0": 4.3.2
  "markdown-it@14.3.0": 14.3.1
  "nanoid@3.3.16": 3.3.18
  "nanoid@5.0.9": 5.1.16
  "undici@7.28.0": 7.29.1
  "xcode>uuid": 11.1.1
  "query-string@7.1.3>decode-uri-component": 0.5.0

# Correcciones de seguridad verificadas el 2026-10-03. Los selectores conservan
# cada rama compatible; xcode solo consume uuid.v4 y Scalar usa Fastify 5.
# El parche versionado adapta query-string al export ESM; Metro 0.84.5+
# incorpora su propio lector de imágenes y ya no depende de image-size.
# Los paquetes sin corrección publicada quedan inventariados en DEVELOPMENT.md.
nodeLinker: isolated
storeDir: .pnpm-store
patchedDependencies:
  expo-symbols@57.0.3: patches/expo-symbols@57.0.3.patch
  query-string@7.1.3: patches/query-string@7.1.3.patch
