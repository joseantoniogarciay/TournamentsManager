packages:
  - apps/*
  - packages/*

allowBuilds:
  "@scarf/scarf": false
  esbuild: false
  vue-demi: false

# La instalación normal no puede modificar la resolución aprobada. Los cambios de
# dependencias se hacen de forma deliberada con `pnpm add`, `pnpm update` o
# `pnpm install --no-frozen-lockfile` y se revisa su diff.
frozenLockfile: true

# Retrasa una semana toda versión recién publicada, también transitiva. Si el
# registro no aporta fecha o no existe una versión madura que cumpla el rango,
# falla en vez de degradar la protección silenciosamente.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

# ADR-0077 permite añadir aquí solo excepciones exactas `paquete@versión` cuando
# Expo CLI exija actualizar su conjunto compatible. No se usan comodines ni
# exclusiones persistentes por familia de paquetes.
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.17"
  - "@expo/config-plugins@57.0.8"
  - "@expo/config@57.0.8"
  - "@expo/fingerprint@0.20.9"
  - "@expo/inline-modules@0.1.6"
  - "@expo/local-build-cache-provider@57.0.7"
  - "@expo/metro-config@57.0.9"
  - "@expo/prebuild-config@57.0.13"
  - "@expo/router-server@57.0.7"
  - "@expo/ui@57.0.12"
  - "agent-cli-detector@0.1.6"
  - "babel-preset-expo@57.0.7"
  - "expo-asset@57.0.13"
  - "expo-auth-session@57.0.8"
  - "expo-constants@57.0.13"
  - "expo-dev-client@57.0.14"
  - "expo-dev-launcher@57.0.14"
  - "expo-dev-menu@57.0.14"
  - "expo-file-system@57.0.5"
  - "expo-linking@57.0.7"
  - "expo-modules-autolinking@57.0.10"
  - "expo-modules-core@57.0.12"
  - "expo-modules-jsi@57.0.5"
  - "expo-router@57.0.15"
  - "expo-server@57.0.3"
  - "expo-splash-screen@57.0.7"
  - "expo@57.0.15"

# Los rangos de Expo Router admiten revisiones más nuevas que aún no han
# madurado. Se fijan a las últimas revisiones anteriores compatibles para que el
# árbol pueda respetar la política sin una exclusión por edad.
overrides:
  "@expo/log-box": 57.0.1
  "@expo/metro-runtime": 57.0.4

nodeLinker: isolated
storeDir: .pnpm-store
