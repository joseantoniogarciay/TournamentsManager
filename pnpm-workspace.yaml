packages:
  - apps/*
  - packages/*

allowBuilds:
  "@scarf/scarf": false
  esbuild: false
  vue-demi: false

minimumReleaseAgeExclude:
  - "@redocly/cli@2.41.0"
  - '@expo/cli@57.0.12'
  - '@expo/router-server@57.0.5'
  - expo-constants@57.0.9
  - expo-modules-core@57.0.9
  - expo@57.0.10
  - '@expo/ui@57.0.9'
  - expo-auth-session@57.0.6
  - expo-linking@57.0.5
  - expo-router@57.0.10

nodeLinker: isolated
storeDir: .pnpm-store
