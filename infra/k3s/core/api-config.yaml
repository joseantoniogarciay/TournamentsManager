apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: prod
  labels:
    app.kubernetes.io/part-of: tournaments-manager
data:
  HTTP_ADDR: "0.0.0.0:8080"
  SMTP_ADDR: "smtp.resend.com:587"
  SMTP_FROM: "FastTourney <no-reply@mail.fasttourney.com>"
  # La credencial SMTP todavía no forma parte del Secret runtime de la API.
  # Mantener ambos campos de autenticación vacíos permite iniciar la API sin
  # ampliar el radio de exposición del Secret de PostgreSQL.
  SMTP_USERNAME: ""
  EMAIL_SUBJECT_PREFIX: ""
  PUBLIC_BASE_URL: "https://fasttourney.com"
  CORS_ALLOWED_ORIGINS: "https://fasttourney.com"
  GOOGLE_CLIENT_IDS: ""
  TRUSTED_PROXY_CIDRS: ""
  # Se aplica después de instalar y verificar Tempo en el namespace prod. La API
  # degrada de forma segura si el backend de trazas no está disponible.
  OTEL_TRACES_ENDPOINT: "http://observability-tempo.prod.svc.cluster.local:4318/v1/traces"
