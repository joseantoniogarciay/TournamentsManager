apiVersion: batch/v1
kind: Job
metadata:
  name: postgresql-bootstrap-migrations
  namespace: prod
  labels:
    app.kubernetes.io/name: postgresql-bootstrap-migrations
    app.kubernetes.io/part-of: tournaments-manager
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql-bootstrap-migrations
        app.kubernetes.io/part-of: tournaments-manager
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap-migrations
          image: tournaments-manager-postgresql:18.4-pgbackrest-2.59.1
          imagePullPolicy: Never
          command:
            - sh
            - -ec
            - |
              mkdir -p /work
              for migration in /bootstrap/migration-*.sql; do
                rendered="/work/$(basename "$migration")"
                sed \
                  -e "s/tournaments_manager_dev_schema_owner/$POSTGRES_OWNER_ROLE/g" \
                  -e "s/tournaments_manager_dev_app/$POSTGRES_APP_USER/g" \
                  "$migration" > "$rendered"
                PGPASSWORD="$POSTGRES_MIGRATOR_PASSWORD" psql \
                  -h postgresql -U "$POSTGRES_MIGRATOR_USER" -d "$POSTGRES_DB" \
                  -v ON_ERROR_STOP=1 -f "$rendered"
              done

              PGPASSWORD="$POSTGRES_MIGRATOR_PASSWORD" psql \
                -h postgresql -U "$POSTGRES_MIGRATOR_USER" -d "$POSTGRES_DB" \
                -v ON_ERROR_STOP=1 <<SQL
              SET ROLE "$POSTGRES_OWNER_ROLE";
              CREATE TABLE goose_db_version (
                  id serial PRIMARY KEY,
                  version_id bigint NOT NULL,
                  is_applied boolean NOT NULL,
                  tstamp timestamp NULL DEFAULT now()
              );
              INSERT INTO goose_db_version (version_id, is_applied)
              VALUES (0, true), (2, true), (3, true), (4, true);
              SQL
          envFrom:
            - configMapRef:
                name: postgresql-config
            - secretRef:
                name: postgresql-runtime
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: bootstrap-sql
              mountPath: /bootstrap
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: bootstrap-sql
          configMap:
            name: postgresql-bootstrap-sql
        - name: work
          emptyDir: {}
