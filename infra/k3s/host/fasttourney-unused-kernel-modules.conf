# Temporary mitigation while Ubuntu Noble's GA kernel has no fixed package
# for CVE-2026-53398, CVE-2026-64535, CVE-2026-64564 and CVE-2026-74394.
# These modules were unloaded and no production Service used SCTP at review.
# Reassess before introducing NFS server, NVMe/TCP target, SCTP or SRP target.
install nfsd /bin/false
blacklist nfsd
install nvmet_tcp /bin/false
blacklist nvmet_tcp
install sctp /bin/false
blacklist sctp
install ib_srpt /bin/false
blacklist ib_srpt
