alloy:
  enableReporting: false
  mounts:
    varlog: false
    dockercontainers: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  configMap:
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["prod"]
        }
      }
      loki.source.kubernetes "pods" {
        targets    = discovery.kubernetes.pods.targets
        forward_to = [loki.process.pods.receiver]
      }
      loki.process "pods" {
        stage.static_labels {
          values = {
            environment = "prod",
          }
        }
        forward_to = [loki.write.default.receiver]
      }
      loki.write "default" {
        endpoint {
          url = "http://observability-loki.prod.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
rbac:
  namespaces:
    - prod
  rules:
    - apiGroups: [""]
      resources: ["pods", "pods/log", "namespaces"]
      verbs: ["get", "list", "watch"]
  clusterRules: []
service:
  enabled: false
