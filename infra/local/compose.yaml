name: tournaments-manager-local

# Rotación de la copia de consola; la ventana temporal la aplica Loki.
x-development-logging: &development-logging
  driver: json-file
  options:
    max-size: 5m
    max-file: "2"
    compress: "true"

services:
  postgres:
    image: postgres:18.4-bookworm
    restart: "no"
    logging: *development-logging
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.30.5
    restart: "no"
    logging: *development-logging
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8025/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
