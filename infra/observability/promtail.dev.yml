server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: tournaments-manager-api
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    pipeline_stages:
      - json:
          expressions:
            log_message: msg
            log_method: method
            log_route: route
            log_status: status
      - drop:
          source: [log_message, log_method, log_route, log_status]
          separator: ";"
          expression: "^HTTP request completed;GET;GET /(healthz|metrics);2[0-9]{2}$"
          drop_counter_reason: successful_probe
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: api
        action: keep
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        regex: tournaments-manager-dev
        action: keep
      - source_labels: [__meta_docker_container_name]
        target_label: container
        regex: /?(.*)
      - target_label: service
        replacement: tournaments-manager-api
