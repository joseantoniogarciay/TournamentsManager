name: tournaments-manager-dev

services:
  postgres:
    image: tournaments-manager-dev-postgres:pgbackrest-2.59.1
    restart: unless-stopped
    build:
      context: ./postgresql
    env_file:
      - .env
    environment:
      PGBACKREST_PG1_USER: ${POSTGRES_USER}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ${POSTGRES_BACKUP_DESTINATION}:/var/lib/pgbackrest
    command:
      [
        "postgres",
        "-c",
        "archive_mode=on",
        "-c",
        "archive_command=pgbackrest --stanza=fasttourney-dev archive-push %p",
        "-c",
        "archive_timeout=3600",
      ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Solo se inicia explícitamente para probar una restauración. Nunca comparte
  # el volumen de datos ni expone un puerto del PostgreSQL público de dev.
  postgres-restore:
    profiles: ["backup-restore"]
    image: tournaments-manager-dev-postgres:pgbackrest-2.59.1
    build:
      context: ./postgresql
    env_file:
      - .env
    environment:
      PGDATA: /restore
    command: ["postgres", "-c", "archive_mode=off"]
    volumes:
      - postgres-restore-data:/restore
      - ${POSTGRES_BACKUP_DESTINATION}:/var/lib/pgbackrest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    image: ${DEV_API_IMAGE:-tournaments-manager-dev-api:latest}
    restart: unless-stopped
    build:
      context: ../../apps/backend
      target: runtime
    env_file:
      - api.docker.env
    volumes:
      - ${LEGAL_AUDIT_BACKUP_DESTINATION}:/legal-audit-backups
      - ${LEGAL_AUDIT_BACKUP_STATE_DIRECTORY}:/legal-audit-state
    secrets:
      - legal_audit_backup_key
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  migrator:
    image: ${DEV_MIGRATOR_IMAGE:-tournaments-manager-dev-migrator:latest}
    restart: "no"
    profiles: ["migration"]
    build:
      context: ../../apps/backend
      target: migrator
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "postgresql://${POSTGRES_MIGRATOR_USER}:${POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&search_path=public&options=-c%20role%3Dtournaments_manager_dev_schema_owner"
    command: ["-dir", "/migrations", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      [
        --config.file=/etc/prometheus/prometheus.yml,
        --storage.tsdb.path=/prometheus,
        --storage.tsdb.retention.time=24h,
      ]
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus-rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.33.1
    restart: unless-stopped
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    ports:
      - "127.0.0.1:9094:9093"
    volumes:
      - ../observability/alertmanager.dev.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets:
      - resend_alerts_smtp_password

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ../observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.5.0
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ../observability/promtail.dev.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/tmp
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.8.2
    restart: unless-stopped
    command: -config.file=/etc/tempo/config.yml
    volumes:
      - ../observability/tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - alertmanager
      - loki
      - tempo

volumes:
  postgres-data:
  postgres-restore-data:
  grafana-data:
  loki-data:
  prometheus-data:
  alertmanager-data:
  promtail-data:
  tempo-data:

secrets:
  resend_alerts_smtp_password:
    file: ./alertmanager.smtp-password
  legal_audit_backup_key:
    file: ${LEGAL_AUDIT_BACKUP_KEY_PATH}

networks:
  default:
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
