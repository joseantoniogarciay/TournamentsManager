name: tournaments-manager-dev

services:
  postgres:
    image: postgres:18.4-bookworm
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    image: ${DEV_API_IMAGE:-tournaments-manager-dev-api:latest}
    build:
      context: ../../apps/backend
      target: runtime
    env_file:
      - api.docker.env
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
