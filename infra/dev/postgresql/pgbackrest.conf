# La contraseña de cifrado vive exclusivamente en PGBACKREST_REPO1_CIPHER_PASS
# dentro de infra/dev/.env, nunca en este fichero versionado.
[global]
log-level-console=warn
log-level-file=off
repo1-cipher-type=aes-256-cbc
repo1-path=/var/lib/pgbackrest
repo1-retention-archive=2
repo1-retention-full=2
start-fast=y

[fasttourney-dev]
pg1-path=/var/lib/postgresql/18/docker
