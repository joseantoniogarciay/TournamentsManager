version: "2"

run:
  timeout: 5m
  # Go 1.26 y golangci-lint 2.12.2 no cargan de forma fiable paquetes de prueba.
  # La suite de pruebas se ejecuta por separado con `go test ./...`.
  tests: false

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
