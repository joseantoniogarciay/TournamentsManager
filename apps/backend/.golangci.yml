version: "2"

run:
  timeout: 5m
  # Con Go 1.26.9 ya cargan los tests, pero la revisión detecta 38 hallazgos
  # pendientes (QA 2026-10-09). `go test ./...` mantiene su validación funcional.
  tests: false

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - nilnesserr
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
