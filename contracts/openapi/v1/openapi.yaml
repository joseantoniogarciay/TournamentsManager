openapi: 3.1.0
info:
  title: TournamentsManager API
  version: 1.0.0-design
  description: >-
    Contrato de diseño del primer incremento. No implica que los endpoints estén
    implementados. Los secretos de sesión y verificación son opacos.
servers:
  - url: http://127.0.0.1:8080/v1
    description: API local de desarrollo.
tags:
  - name: Registration
    description: Alta local y verificación de correo.
  - name: Password recovery
    description: Recuperación no enumeradora de contraseñas locales.
  - name: Usernames
    description: Consulta pública y no vinculante de nombres de usuario.
  - name: Session
    description: Creación, consulta y revocación de sesiones propias.
  - name: Federated identity
    description: Autenticación con Google y vinculación explícita de identidades.
  - name: Drafts
    description: Borrador local transferido junto al alta.
  - name: Tournaments
    description: Publicación y lectura pública de torneos visibles.
  - name: Notifications
    description: Buzón interno de la cuenta autenticada.
paths:
  /me/notifications:
    get:
      tags: [Notifications]
      operationId: listCurrentAccountNotifications
      summary: Lista el buzón interno de la cuenta actual
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      responses:
        "200":
          {
            description: "Notificaciones actuales, de más reciente a más antigua.",
            content:
              { application/json: { schema: { $ref: "#/components/schemas/Notifications" } } },
          }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
    delete:
      tags: [Notifications]
      operationId: deleteAllCurrentAccountNotifications
      summary: Elimina todas las notificaciones de la cuenta actual
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      responses:
        "204": { description: Buzón eliminado. }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
  /me/notifications/read:
    post:
      tags: [Notifications]
      operationId: markAllCurrentAccountNotificationsRead
      summary: Marca como leídas todas las notificaciones de la cuenta actual
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      responses:
        "204": { description: Buzón marcado como leído. }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
  /me/notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: getCurrentAccountUnreadNotificationCount
      summary: Devuelve el número de notificaciones no leídas
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      responses:
        "200":
          {
            description: "Contador actual.",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/UnreadNotificationCount" } },
              },
          }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
  /me/notifications/{notificationId}:
    delete:
      tags: [Notifications]
      operationId: deleteCurrentAccountNotification
      summary: Elimina una notificación de la cuenta actual
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
      responses:
        "204": { description: Notificación eliminada o inexistente. }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
  /me/account:
    delete:
      tags: [Session]
      operationId: scheduleAccountDeletion
      summary: Programa la eliminación de la cuenta actual
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      responses:
        "200":
          description: Baja programada y accesos revocados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDeletionScheduled" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "409": { $ref: "#/components/responses/AccountDeletionConflictProblem" }
  /me/access-methods:
    get:
      tags: [Session]
      operationId: getAccessMethods
      summary: Devuelve los datos de acceso de la cuenta actual
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      responses:
        "200":
          description: Datos de acceso disponibles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessMethods" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
  /me/reauthentication-tickets:
    post:
      tags: [Session]
      operationId: createReauthenticationTicket
      summary: Confirma un método actual y emite un ticket de un solo uso
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthenticationRequest" }
      responses:
        "201":
          description: Ticket emitido; vence en cinco minutos y solo sirve para la sesión actual.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReauthenticationTicket" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "409":
          description: La cuenta Google elegida no está vinculada a la cuenta actual.
          $ref: "#/components/responses/VerificationConflictProblem"
  /me/local-credential:
    put:
      tags: [Session]
      operationId: putLocalCredential
      summary: Añade o cambia la contraseña local con un ticket reciente
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalCredentialRequest" }
      responses:
        "204": { description: Contraseña local establecida. }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
    delete:
      tags: [Session]
      operationId: deleteCurrentAccountLocalCredential
      summary: Elimina la contraseña local tras acreditar Google
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthenticationTicketRequest" }
      responses:
        "204": { description: Contraseña local eliminada. }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
  /me/google-identities:
    post:
      tags: [Federated identity]
      operationId: createCurrentAccountGoogleIdentity
      summary: Vincula Google a la cuenta actual con ticket reciente
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleIdentityLinkRequest" }
      responses:
        "204": { description: Identidad vinculada o ya vinculada a la misma cuenta. }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "409": { $ref: "#/components/responses/VerificationConflictProblem" }
    delete:
      tags: [Federated identity]
      operationId: deleteCurrentAccountGoogleIdentity
      summary: Desvincula Google tras acreditar la contraseña
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthenticationTicketRequest" }
      responses:
        "204": { description: Google desvinculado. }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
  /password-resets:
    post:
      tags: [Password recovery]
      operationId: requestPasswordReset
      summary: Solicita un enlace de restablecimiento sin enumerar cuentas
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "202": { description: "Solicitud aceptada, exista o no una credencial local elegible." }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/RateLimitProblem" }
  /password-reset-links:
    post:
      tags: [Password recovery]
      operationId: inspectPasswordResetLink
      summary: Recupera el email asociado a un enlace de restablecimiento válido
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { $ref: "#/components/schemas/OpaqueToken" }
      responses:
        "200":
          description: Enlace válido; la inspección no lo consume.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordResetLink" }
        "409": { $ref: "#/components/responses/VerificationConflictProblem" }
        "410": { $ref: "#/components/responses/VerificationExpiredProblem" }
  /password-reset-confirmations:
    post:
      tags: [Password recovery]
      operationId: confirmPasswordReset
      summary: Consume un enlace y establece una contraseña nueva
      security: [{ sessionCookie: [] }, { bearerSession: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetConfirmationRequest" }
      responses:
        "200":
          description: Contraseña cambiada y sesión nueva establecida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionEstablishment" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "409": { $ref: "#/components/responses/VerificationConflictProblem" }
        "410": { $ref: "#/components/responses/VerificationExpiredProblem" }
  /usernames/{username}/availability:
    get:
      tags: [Usernames]
      operationId: getUsernameAvailability
      summary: Indica si un username puede usarse en este momento
      description: >-
        Esta consulta no reserva el username. El alta vuelve a comprobar la
        unicidad para resolver carreras entre clientes.
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Username" }
      responses:
        "200":
          description: Disponibilidad actual del username.
          headers:
            Cache-Control:
              description: La respuesta no se almacena porque puede cambiar inmediatamente.
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsernameAvailability" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/RateLimitProblem" }
        "503": { $ref: "#/components/responses/ServiceUnavailableProblem" }
  /users:
    get:
      tags: [Users]
      operationId: searchUsers
      summary: Busca usernames públicos por coincidencia parcial
      description: >-
        No requiere sesión. Devuelve como máximo veinte usernames de cuentas
        verificadas cuyo nombre contiene query. No expone email, IDs, métodos
        de acceso ni estado de cuenta.
      security: []
      parameters:
        - name: query
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Username" }
      responses:
        "200":
          description: Coincidencias públicas, ordenadas por username.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSearchResponse" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/RateLimitProblem" }
        "503": { $ref: "#/components/responses/ServiceUnavailableProblem" }
  /registrations:
    post:
      tags: [Registration]
      operationId: registerLocalAccount
      summary: Crea una cuenta pendiente y, opcionalmente, transfiere un borrador local
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202":
          description: La solicitud se aceptó; la respuesta es deliberadamente genérica.
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/RateLimitProblem" }
  /registration-verifications/resend:
    post:
      tags: [Registration]
      operationId: resendRegistrationVerification
      summary: Solicita otro correo de verificación sin enumerar cuentas
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { $ref: "#/components/schemas/Email" }
      responses:
        "202": { description: "Solicitud aceptada, exista o no una cuenta elegible." }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/RateLimitProblem" }
  /registration-verifications:
    post:
      tags: [Registration]
      operationId: verifyRegistration
      summary: Consume una verificación y establece una sesión
      security: []
      description: >-
        Operación atómica: valida y consume el token, activa una cuenta que ya
        tiene username y crea una sesión. Repetirla nunca crea otra sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyRegistrationRequest" }
      responses:
        "200":
          description: Cuenta activada y sesión establecida.
          headers:
            Set-Cookie:
              description: >-
                Presente solo cuando sessionTransport es cookie; __Host-, Secure,
                HttpOnly, SameSite=Lax, Path=/ y sin Domain.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionEstablishment" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "409": { $ref: "#/components/responses/VerificationConflictProblem" }
        "410": { $ref: "#/components/responses/VerificationExpiredProblem" }
        "429": { $ref: "#/components/responses/RateLimitProblem" }
  /sessions:
    post:
      tags: [Session]
      operationId: createSession
      summary: Autentica una cuenta local verificada y crea una sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Sesión creada para una cuenta verificada.
          headers:
            Set-Cookie:
              description: Presente solo para transporte cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionEstablishment" }
        "202":
          description: >-
            Las credenciales corresponden a una cuenta pendiente; se invalidó
            cualquier verificación activa y se solicitó un correo nuevo. No hay sesión.
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "429": { $ref: "#/components/responses/RateLimitProblem" }
    get:
      tags: [Session]
      operationId: getCurrentSession
      summary: Devuelve la identidad de la sesión actual
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      responses:
        "200":
          description: Sesión válida.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentSession" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
    delete:
      tags: [Session]
      operationId: revokeCurrentSession
      summary: Revoca la sesión actual
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      responses:
        "204": { description: "Sesión revocada; para cookie, también se expira la cookie." }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
  /sessions/refresh:
    post:
      tags: [Session]
      operationId: refreshSession
      summary: Rota una sesión mediante su refresh token
      security: [{ refreshCookie: [] }, { bearerRefresh: [] }]
      responses:
        "200":
          description: Access y refresh token rotados.
          headers:
            Set-Cookie:
              description: >-
                Para transporte cookie, actualiza las cookies persistentes access y refresh;
                ambas son __Host-, Secure, HttpOnly, SameSite=Lax, Path=/ y sin Domain.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionEstablishment" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
  /google-login-challenges:
    post:
      tags: [Federated identity]
      operationId: createGoogleLoginChallenge
      summary: Crea un nonce de un solo uso para iniciar Google
      security: []
      responses:
        "201":
          description: Challenge creado; vence en cinco minutos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleLoginChallenge" }
        "429": { $ref: "#/components/responses/RateLimitProblem" }
        "503": { $ref: "#/components/responses/ServiceUnavailableProblem" }
  /google-sessions:
    post:
      tags: [Federated identity]
      operationId: createGoogleSession
      summary: Valida Google e inicia sesión o crea una cuenta Google nueva
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleAuthenticationRequest" }
      responses:
        "200":
          description: Sesión propia creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionEstablishment" }
        "202":
          description: La identidad es nueva y requiere elegir username para crear una cuenta Google; no hay sesión.
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "409":
          description: La identidad es nueva, pero su email ya pertenece a otra cuenta; no se vincula ni se crea sesión.
          $ref: "#/components/responses/VerificationConflictProblem"
        "503": { $ref: "#/components/responses/ServiceUnavailableProblem" }
  /me/tournaments:
    get:
      tags: [Tournaments]
      operationId: listCurrentAccountTournaments
      summary: Lista los torneos administrados o seguidos por la cuenta actual
      description: >-
        La relación administered incluye propiedad y administración delegada.
        La relación followed excluye torneos que la cuenta administra para que las
        colecciones sean disjuntas.
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      parameters:
        - name: relationship
          in: query
          required: true
          schema: { $ref: "#/components/schemas/TournamentRelationshipFilter" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          description: ID UUIDv7 del último elemento de la página anterior.
          schema: { $ref: "#/components/schemas/UUID" }
      responses:
        "200":
          description: Página de torneos relacionados con la sesión.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountTournamentPage" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
  /me/recent-tournaments:
    get:
      tags: [Tournaments]
      operationId: listRecentAccountTournaments
      summary: Lista hasta cinco torneos relacionados con actividad reciente
      description: >-
        Incluye una vez cada torneo administrado o seguido por la cuenta actual.
        Una relación administrada prevalece sobre seguida y el orden es por
        actividad del torneo descendente, con ID UUIDv7 descendente como desempate.
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      responses:
        "200":
          description: Resumen de hasta cinco torneos relacionados recientes.
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items: { $ref: "#/components/schemas/AccountTournament" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
  /me/tournaments/{tournamentId}/follow:
    put:
      tags: [Tournaments]
      operationId: followTournament
      summary: Guarda un torneo visible para la cuenta actual
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
      responses:
        "204": { description: El torneo ya está guardado o se ha guardado ahora. }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { description: Origen no permitido para una mutación con cookie. }
        "404": { description: El torneo no existe o no es visible. }
    delete:
      tags: [Tournaments]
      operationId: unfollowTournament
      summary: Elimina un torneo guardado de la cuenta actual
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
      responses:
        "204": { description: El torneo ya no está guardado. }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { description: Origen no permitido para una mutación con cookie. }
  /tournaments:
    post:
      tags: [Tournaments]
      operationId: createTournament
      summary: Crea un torneo visible sin empezar
      description: >-
        Exige sesión válida de la organizadora. El torneo nace en published, sin
        partidos, y puede editarse hasta que se inicie.
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentInput" }
      responses:
        "201":
          description: Torneo creado sin empezar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishedTournament" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
  /tournaments/{tournamentId}:
    get:
      tags: [Tournaments]
      operationId: getPublicTournament
      summary: Lee un torneo visible por su identificador público
      security: []
      parameters:
        - name: tournamentId
          in: path
          required: true
          description: Identificador público del torneo; no concede permisos de escritura.
          schema: { $ref: "#/components/schemas/UUID" }
      responses:
        "200":
          description: Proyección pública de solo lectura.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTournament" }
        "404":
          description: El torneo no existe o no es visible.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /tournaments/{tournamentId}/start:
    post:
      tags: [Tournaments]
      operationId: startTournament
      summary: Configura e inicia un torneo publicado
      description: >-
        Congela una única fase: liga a una o dos vueltas, o eliminatoria directa
        a partido único. El servidor genera todos los partidos y, en el cuadro,
        sus fuentes y pases directos deterministas.
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartTournamentRequest" }
      responses:
        "200":
          description: Torneo iniciado y partidos generados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTournament" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { description: La sesión no pertenece a la organizadora. }
        "404": { description: El torneo no existe. }
        "409": { description: El torneo ya no está sin empezar. }
  /tournaments/{tournamentId}/teams:
    post:
      tags: [Tournaments]
      operationId: addTournamentTeam
      summary: Añade un equipo a un torneo sin empezar
      description: >-
        Exige sesión de la organizadora. Solo se admite mientras el torneo esté
        publicada; al iniciarla, la composición queda congelada.
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamInput" }
      responses:
        "201":
          description: Equipo añadido a la composición del torneo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentTeam" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { description: La sesión no pertenece a la organizadora. }
        "404": { description: El torneo no existe. }
        "409":
          { description: "El torneo ya se inició, alcanzó el límite o ya contiene ese nombre." }
  /tournaments/{tournamentId}/teams/{teamId}:
    delete:
      tags: [Tournaments]
      operationId: removeTournamentTeam
      summary: Elimina un equipo de un torneo sin empezar
      description: >-
        Exige sesión de la organizadora. Solo se admite mientras el torneo esté
        publicado y conserva al menos dos equipos; para descartarlo debe
        usarse su cancelación explícita.
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
        - name: teamId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
      responses:
        "204": { description: Equipo eliminado de la composición del torneo. }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { description: La sesión no pertenece a la organizadora. }
        "404": { description: El torneo o el equipo no existe. }
        "409": { description: "El torneo ya se inició o solo conserva dos equipos." }
  /tournaments/{tournamentId}/teams/{teamId}/withdraw:
    post:
      tags: [Tournaments]
      operationId: withdrawTournamentTeam
      summary: Declara la baja de un equipo en una liga en curso
      description: >-
        Exige sesión de la organizadora y una fase de liga en curso. No se
        admite en eliminatoria. Conserva el equipo
        y todos los partidos como historial de la competición; cada uno pasa a
        3-0 a favor de su rival y se registra el cambio.
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
        - name: teamId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
      responses:
        "200":
          description: Baja aplicada y proyección pública actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTournament" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { description: La sesión no pertenece a la organizadora. }
        "404": { description: El torneo o el equipo no existe. }
        "409": { description: El torneo no es una liga en curso o el equipo ya fue retirado. }
  /tournaments/{tournamentId}/cancel:
    post:
      tags: [Tournaments]
      operationId: cancelTournament
      summary: Cancela un torneo publicado o en curso
      description: >-
        Exige sesión válida de la organizadora. No solicita motivo, conserva la
        el torneo y lo mantiene disponible para consulta pública en estado cancelled.
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
      responses:
        "200":
          description: Torneo cancelado y aún visible en modo de solo lectura.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTournament" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { description: La sesión no pertenece a la organizadora. }
        "404": { description: El torneo no existe. }
        "409": { description: El torneo no está publicado ni en curso. }
  /tournaments/{tournamentId}/complete:
    post:
      tags: [Tournaments]
      operationId: completeTournament
      summary: Finaliza explícitamente un torneo con todos los resultados
      description: >-
        Exige sesión válida de la organizadora y un torneo en curso sin partidos
        pendientes. En liga conserva todos los co-campeones de la clasificación;
        en eliminatoria conserva la ganadora final. El cliente no las envía.
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
      responses:
        "200":
          description: Torneo finalizado con campeonas oficiales.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTournament" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { description: La sesión no pertenece a la organizadora. }
        "404": { description: El torneo no existe. }
        "409": { description: El torneo no está en curso o aún tiene partidos pendientes. }
  /tournaments/{tournamentId}/matches/{matchId}/result:
    put:
      tags: [Tournaments]
      operationId: recordMatchResult
      summary: Registra o corrige el resultado de un partido
      description: >-
        Exige sesión válida de la organizadora o una administradora delegada y
        un torneo en curso. En eliminatoria ambos participantes deben estar
        resueltos y no puede corregirse un resultado ya consumido por un partido
        posterior.
        El resultado se aplica inmediatamente; una corrección conserva su
        historial interno de valores y autora.
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
        - name: matchId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchResultInput" }
      responses:
        "200":
          description: Resultado aplicado y proyección pública actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicTournament" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { description: La sesión no administra los resultados de este torneo. }
        "404": { description: El torneo o el partido no existe. }
        "409":
          description: >-
            El torneo no está en curso, faltan participantes o un partido
            posterior ya consumió el resultado.
  /tournaments/{tournamentId}/administrators:
    get:
      tags: [Tournaments]
      operationId: listTournamentAdministrators
      summary: Lista las administradoras delegadas de un torneo
      description: Exige sesión de la organizadora del torneo.
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
      responses:
        "200":
          description: Administradoras delegadas actuales, ordenadas por username.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TournamentAdministrators" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { description: La sesión no pertenece a la organizadora. }
        "404": { description: El torneo no existe. }
  /tournaments/{tournamentId}/administrators/{username}:
    put:
      tags: [Tournaments]
      operationId: assignTournamentAdministrator
      summary: Asigna directamente una administradora por username
      description: >-
        Exige sesión de la organizadora. La asignación es inmediata, idempotente
        y no envía una invitación. Cuando crea una delegación nueva, añade una
        notificación interna al buzón de la administradora.
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
        - name: username
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Username" }
      responses:
        "204": { description: La cuenta ya administra el torneo. }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { description: La sesión no pertenece a la organizadora. }
        "404": { description: El torneo o la cuenta no existe. }
        "409": { description: No se puede asignar a la organizadora como administradora delegada. }
    delete:
      tags: [Tournaments]
      operationId: removeTournamentAdministrator
      summary: Retira una administradora delegada por username
      description: Exige sesión de la organizadora. La retirada es idempotente.
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
        - name: username
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Username" }
      responses:
        "204": { description: La cuenta ya no administra el torneo. }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { description: La sesión no pertenece a la organizadora. }
        "404": { description: El torneo no existe. }
  /tournaments/{tournamentId}/transfer:
    post:
      tags: [Tournaments]
      operationId: transferTournamentOwnership
      summary: Transfiere la propiedad de un torneo a otra cuenta
      description: >-
        Exige sesión de la organizadora. La transferencia es inmediata y
        atómica; la destinataria debe ser una cuenta verificada distinta.
      security: [{ sessionCookie: [] }, { bearerSession: [] }]
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/UUID" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TournamentOwnershipTransferRequest" }
      responses:
        "204": { description: Propiedad transferida. }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/AuthenticationProblem" }
        "403": { description: La sesión no pertenece a la organizadora. }
        "404": { description: El torneo o la cuenta no existe. }
        "409": { description: La organizadora no puede transferirse el torneo a sí misma. }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-tm_session
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-tm_refresh
    bearerSession:
      type: http
      scheme: bearer
    bearerRefresh:
      type: http
      scheme: bearer
      bearerFormat: opaque
  responses:
    ValidationProblem:
      description: Entrada inválida.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    AuthenticationProblem:
      description: Sesión ausente, vencida o revocada.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    VerificationConflictProblem:
      description: Token ya consumido o estado de cuenta incompatible.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    VerificationExpiredProblem:
      description: Token vencido.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    RateLimitProblem:
      description: Límite de solicitudes alcanzado.
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    ServiceUnavailableProblem:
      description: Operación temporalmente no disponible.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
    AccountDeletionConflictProblem:
      description: La cuenta todavía organiza algún torneo.
      content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } }
  schemas:
    UUID:
      type: string
      format: uuid
      description: UUIDv7.
    Email:
      type: string
      format: email
      maxLength: 254
    Username:
      type: string
      minLength: 3
      maxLength: 30
      pattern: "^[a-z0-9_]+$"
      description: Minúsculas; los nombres reservados se validan en el servidor.
    UsernameAvailability:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
          description: >-
            Estado actual informativo; no constituye una reserva y puede cambiar
            antes de enviar el alta.
    UserSearchResponse:
      type: object
      required: [usernames]
      properties:
        usernames:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/Username" }
    TournamentAdministrators:
      type: object
      required: [usernames]
      properties:
        usernames:
          type: array
          items: { $ref: "#/components/schemas/Username" }
    Notification:
      type: object
      required: [id, kind, tournamentId, tournamentName, createdAt, readAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        kind:
          {
            type: string,
            enum: [tournament_administrator_assigned, tournament_ownership_transferred],
          }
        tournamentId: { $ref: "#/components/schemas/UUID" }
        tournamentName: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
    Notifications:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
    UnreadNotificationCount:
      type: object
      required: [count]
      properties:
        count: { type: integer, minimum: 0 }
    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 1024
      writeOnly: true
    OpaqueToken:
      type: string
      minLength: 22
      maxLength: 512
      pattern: "^[A-Za-z0-9_-]+$"
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { $ref: "#/components/schemas/Email" }
    PasswordResetLink:
      type: object
      required: [email]
      properties:
        email: { $ref: "#/components/schemas/Email" }
    PasswordResetConfirmationRequest:
      type: object
      required: [token, password, sessionTransport]
      properties:
        token: { $ref: "#/components/schemas/OpaqueToken" }
        password: { $ref: "#/components/schemas/Password" }
        sessionTransport: { $ref: "#/components/schemas/Transport" }
    Transport:
      type: string
      enum: [cookie, bearer]
    TeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    TournamentInput:
      type: object
      required: [name, teams]
      properties:
        name: { type: string, minLength: 1, maxLength: 56 }
        teams:
          type: array
          minItems: 2
          maxItems: 64
          items: { $ref: "#/components/schemas/TeamInput" }
    RegisterRequest:
      type: object
      required: [email, password, username, locale, termsVersion]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/Password" }
        username: { $ref: "#/components/schemas/Username" }
        locale: { $ref: "#/components/schemas/Locale" }
        termsVersion:
          type: string
          enum: ["2026-08-22"]
        draft:
          description: Borrador local válido transferido junto al alta; es opcional.
          allOf: [{ $ref: "#/components/schemas/TournamentInput" }]
    Locale:
      type: string
      enum: [es, en, it, fr]
    VerifyRegistrationRequest:
      type: object
      required: [token, sessionTransport]
      properties:
        token: { $ref: "#/components/schemas/OpaqueToken" }
        sessionTransport: { $ref: "#/components/schemas/Transport" }
    LoginRequest:
      type: object
      required: [email, password, sessionTransport]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/Password" }
        sessionTransport: { $ref: "#/components/schemas/Transport" }
    User:
      type: object
      required: [id, username]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        username: { $ref: "#/components/schemas/Username" }
    SessionEstablishment:
      type: object
      required: [user, delivery, expiresAt, refreshExpiresAt]
      properties:
        user: { $ref: "#/components/schemas/User" }
        delivery: { $ref: "#/components/schemas/Transport" }
        sessionToken:
          allOf: [{ $ref: "#/components/schemas/OpaqueToken" }]
          description: Presente solo cuando delivery es bearer; guardar únicamente en Keychain/Keystore.
        expiresAt: { type: string, format: date-time }
        refreshToken:
          allOf: [{ $ref: "#/components/schemas/OpaqueToken" }]
          description: Presente solo cuando delivery es bearer; guardar únicamente en Keychain/Keystore.
        refreshExpiresAt: { type: string, format: date-time }
    CurrentSession:
      type: object
      required: [user, idleExpiresAt, absoluteExpiresAt]
      properties:
        user: { $ref: "#/components/schemas/User" }
        idleExpiresAt: { type: string, format: date-time }
        absoluteExpiresAt: { type: string, format: date-time }
    AccessMethods:
      type: object
      required: [email, username, methods]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        username: { $ref: "#/components/schemas/Username" }
        methods:
          type: object
          required: [password, google]
          properties:
            password: { type: boolean }
            google: { type: boolean }
    ReauthenticationRequest:
      type: object
      required: [purpose]
      oneOf:
        - required: [password]
          properties:
            password: { $ref: "#/components/schemas/Password" }
        - required: [challengeId, idToken]
          properties:
            challengeId: { $ref: "#/components/schemas/UUID" }
            idToken: { $ref: "#/components/schemas/OpaqueToken" }
      properties:
        purpose:
          type: string
          enum: [set-local-password, link-google, unlink-google, remove-local-password]
    ReauthenticationTicket:
      type: object
      required: [ticket, expiresAt]
      properties:
        ticket: { $ref: "#/components/schemas/OpaqueToken" }
        expiresAt: { type: string, format: date-time }
    LocalCredentialRequest:
      type: object
      required: [ticket, password]
      properties:
        ticket: { $ref: "#/components/schemas/OpaqueToken" }
        password: { $ref: "#/components/schemas/Password" }
    ReauthenticationTicketRequest:
      type: object
      required: [ticket]
      properties:
        ticket: { $ref: "#/components/schemas/OpaqueToken" }
    GoogleIdentityLinkRequest:
      type: object
      required: [ticket, challengeId, idToken]
      properties:
        ticket: { $ref: "#/components/schemas/OpaqueToken" }
        challengeId: { $ref: "#/components/schemas/UUID" }
        idToken: { $ref: "#/components/schemas/OpaqueToken" }
    TournamentRelationshipFilter:
      type: string
      enum: [administered, followed]
    TournamentOwnershipTransferRequest:
      type: object
      required: [username]
      properties:
        username: { $ref: "#/components/schemas/Username" }
    AccountTournamentRelationship:
      type: string
      enum: [organizer, delegated, follower]
    AccountTournament:
      type: object
      required: [id, name, state, createdAt, lastActivityAt, relationship]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        state: { type: string, enum: [published, in_progress, completed, cancelled] }
        createdAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
        relationship: { $ref: "#/components/schemas/AccountTournamentRelationship" }
    AccountTournamentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AccountTournament" }
        nextCursor:
          description: Ausente cuando no hay más elementos.
          allOf: [{ $ref: "#/components/schemas/UUID" }]
    GoogleLoginChallenge:
      type: object
      required: [id, nonce, expiresAt]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        nonce: { $ref: "#/components/schemas/OpaqueToken" }
        expiresAt: { type: string, format: date-time }
    GoogleAuthenticationRequest:
      type: object
      required: [challengeId, idToken, sessionTransport]
      properties:
        challengeId: { $ref: "#/components/schemas/UUID" }
        idToken: { $ref: "#/components/schemas/OpaqueToken" }
        sessionTransport: { $ref: "#/components/schemas/Transport" }
        username:
          description: Requerido solo para crear una cuenta Google nueva; se valida de nuevo al guardar.
          allOf: [{ $ref: "#/components/schemas/Username" }]
        locale:
          description: Requerido junto a username para crear una cuenta Google nueva.
          allOf: [{ $ref: "#/components/schemas/Locale" }]
        termsVersion:
          description: Requerido junto a username al crear una cuenta Google nueva.
          type: string
          enum: ["2026-08-22"]
        draft:
          description: Torneo válido transferido únicamente al crear una cuenta Google nueva.
          allOf: [{ $ref: "#/components/schemas/TournamentInput" }]
    StartTournamentRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [format, roundRobinLegs]
          properties:
            format: { const: league }
            roundRobinLegs: { type: integer, enum: [1, 2] }
        - type: object
          additionalProperties: false
          required: [format]
          properties:
            format: { const: single_elimination }
    MatchResultInput:
      type: object
      required: [homeScore, awayScore]
      properties:
        homeScore: { type: integer, minimum: 0 }
        awayScore: { type: integer, minimum: 0 }
        homePenalties: { type: integer, minimum: 0 }
        awayPenalties: { type: integer, minimum: 0 }
      description: >-
        En liga solo se admiten goles. En eliminatoria, los goles iguales exigen
        ambos marcadores de penaltis distintos; con goles distintos no se envían
        penaltis. Los penaltis no se suman a los goles del partido.
    PublishedTournament:
      type: object
      required: [id, name, state, teams, matches]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        state: { type: string, enum: [published] }
        teams: { type: array, items: { $ref: "#/components/schemas/TournamentTeam" } }
        matches: { type: array, items: { $ref: "#/components/schemas/Match" } }
    PublicTournament:
      type: object
      required:
        [
          id,
          name,
          sport,
          format,
          state,
          roundRobinLegs,
          teams,
          stages,
          matches,
          standings,
          championTeamIds,
        ]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        sport: { type: string, enum: [football] }
        format: { type: string, enum: [league, single_elimination] }
        stages:
          type: array
          items: { $ref: "#/components/schemas/TournamentStage" }
        state: { type: string, enum: [published, in_progress, completed, cancelled] }
        roundRobinLegs:
          type: integer
          enum: [1, 2]
          description: Vueltas fijadas para una fase de liga; en eliminatoria se conserva 1 por compatibilidad interna del primer incremento.
        teams: { type: array, items: { $ref: "#/components/schemas/TournamentTeam" } }
        matches: { type: array, items: { $ref: "#/components/schemas/Match" } }
        standings:
          description: Proyección de liga calculada por el backend; vacía en eliminatoria, antes de iniciar o tras cancelar.
          type: array
          items: { $ref: "#/components/schemas/TournamentStanding" }
        championTeamIds:
          description: >-
            Campeonas conservadas al finalizar. Está vacío hasta el cierre
            explícito; admite más de una solo cuando una liga termina con
            co-campeonato.
          type: array
          items: { $ref: "#/components/schemas/UUID" }
    TournamentStanding:
      type: object
      required:
        [position, teamId, played, won, drawn, lost, goalsFor, goalsAgainst, goalDifference, points]
      properties:
        position: { type: integer, minimum: 1 }
        teamId: { $ref: "#/components/schemas/UUID" }
        played: { type: integer, minimum: 0 }
        won: { type: integer, minimum: 0 }
        drawn: { type: integer, minimum: 0 }
        lost: { type: integer, minimum: 0 }
        goalsFor: { type: integer, minimum: 0 }
        goalsAgainst: { type: integer, minimum: 0 }
        goalDifference: { type: integer }
        points: { type: integer, minimum: 0 }
    TournamentStage:
      type: object
      required: [id, position, type, state]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        position: { type: integer, minimum: 1 }
        type: { type: string, enum: [league, single_elimination] }
        state: { type: string, enum: [pending, in_progress, completed, cancelled] }
        roundRobinLegs: { type: integer, enum: [1, 2] }
    TournamentTeam:
      type: object
      required: [id, name, withdrawn]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        withdrawn:
          type: boolean
          description: Indica que la organizadora declaró su baja durante la liga en curso.
    Match:
      type: object
      required:
        [
          id,
          stageId,
          round,
          sequence,
          homeTeamId,
          awayTeamId,
          homeSourceKind,
          awaySourceKind,
          state,
        ]
      properties:
        id: { $ref: "#/components/schemas/UUID" }
        round: { type: integer, minimum: 1 }
        sequence: { type: integer, minimum: 1 }
        stageId: { $ref: "#/components/schemas/UUID" }
        homeTeamId:
          description: UUID del equipo conocido; cadena vacía si la plaza aún no está resuelta o es bye.
          type: string
          pattern: "^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        awayTeamId:
          type: string
          pattern: "^$|^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        homeSourceKind: { type: string, enum: [seeded_team, winner, bye] }
        awaySourceKind: { type: string, enum: [seeded_team, winner, bye] }
        homeSourceMatchId: { $ref: "#/components/schemas/UUID" }
        awaySourceMatchId: { $ref: "#/components/schemas/UUID" }
        winnerTeamId: { $ref: "#/components/schemas/UUID" }
        state: { type: string, enum: [pending, completed, bye] }
        homeScore: { type: integer, minimum: 0 }
        awayScore: { type: integer, minimum: 0 }
        homePenalties: { type: integer, minimum: 0 }
        awayPenalties: { type: integer, minimum: 0 }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        requestId: { type: string }
    AccountDeletionScheduled:
      type: object
      required: [deletionEffectiveAt]
      properties:
        deletionEffectiveAt: { type: string, format: date-time }
